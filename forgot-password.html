<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Fu Jen imMBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=ux27">
</head>
<body data-page="forgot-password.html">
  <main id="main" class="admin-page">
    <div class="admin-shell auth-shell">
      <aside class="admin-sidebar">
        <p class="admin-kicker" data-i18n="auth.authKicker">Authentication</p>
        <h1 data-i18n="auth.forgot">Reset password</h1>
        <p class="admin-side-lead" data-i18n="auth.forgotLead">We will email a link so you can create a new password.</p>
        <nav class="admin-side-nav" aria-label="Account">
          <a href="login.html" data-i18n="auth.login">Sign in</a>
          <a class="is-active" href="forgot-password.html" data-i18n="auth.forgot">Reset password</a>
          <a href="index.html" data-i18n="admin.publicHome">Public homepage</a>
        </nav>
      </aside>
      <div class="admin-content">
        <p id="auth-status" class="admin-status hidden" role="status"></p>
        <form id="forgot-form" class="panel auth-panel">
          <h2 data-i18n="auth.forgot">Reset password</h2>
          <label><span data-i18n="auth.email">Email</span> <input type="email" name="email" required autocomplete="username"></label>
          <p class="cta-row">
            <button class="btn btn-navy" type="submit" data-i18n="auth.sendReset">Send reset link</button>
            <a class="btn btn-outline" href="login.html" data-i18n="auth.login">Sign in</a>
          </p>
        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/data.js?v=ux27"></script>
  <script src="assets/js/supabase.js?v=ux27"></script>
  <script src="assets/js/auth.js?v=ux27"></script>
  <script src="assets/js/i18n.js?v=ux27"></script>
  <script src="assets/js/site.js?v=ux27"></script>
</body>
</html>
