<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Fu Jen imMBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=ux17">
</head>
<body data-page="contact.html">
  <main id="main">
    <section class="section">
      <div class="wrap grid-2">
        <div class="panel">
          <h3 data-i18n="con.office">imMBA office</h3>
          <p>Ms. Chang<br>TEL: <a href="tel:+886229052750">+886-2-2905-2750</a><br>Email: <a href="mailto:imMBA@mail.fju.edu.tw">imMBA@mail.fju.edu.tw</a></p>
          <p>No. 510, Zhongzheng Rd., Xinzhuang Dist., New Taipei City 24205, Taiwan<br>Office: LM208-1</p>
          <p class="cta-row"><a class="btn btn-navy" href="https://maps.google.com/?q=Fu+Jen+Catholic+University+College+of+Management" target="_blank" rel="noreferrer" data-i18n="con.maps">Open the campus map</a></p>
        </div>
        <form class="panel" id="contact-form">
          <label><span data-i18n="con.topic">Topic</span>
            <select name="topic" required>
              <option value="" data-i18n="con.select">Please select</option>
              <option data-i18n="con.opt1">imMBA related</option>
              <option data-i18n="con.opt2">Admissions</option>
              <option data-i18n="con.opt3">Dual degree</option>
              <option data-i18n="con.opt4">Current students</option>
              <option data-i18n="con.opt5">Other</option>
            </select>
          </label>
          <label><span data-i18n="con.name">Name</span> <input name="name" required></label>
          <label><span data-i18n="con.email">Email</span> <input type="email" name="email" required></label>
          <label><span data-i18n="con.subject">Subject</span> <input name="subject" required></label>
          <label><span data-i18n="con.message">Message</span> <textarea name="message" rows="5" required></textarea></label>
          <button class="btn btn-navy" type="submit" data-i18n="con.submit">Submit</button>
          <p id="form-ok" class="hidden" data-i18n="con.ok">Your mail client should open with the message ready for imMBA@mail.fju.edu.tw.</p>
        </form>
      </div>
    </section>
  </main>
  <script src="assets/js/data.js?v=ux17"></script>
  <script src="assets/js/i18n.js?v=ux17"></script>
  <script src="assets/js/site.js?v=ux17"></script>
</body>
</html>
