  <script>
    (function () {
      var openMarket = document.getElementById("open-market");
      if (!openMarket) return;
      if (typeof MARKET_URL === "string" && MARKET_URL) openMarket.href = marketUrl();
      else {
        var row = openMarket.parentElement;
        openMarket.remove();
        if (row && row.classList.contains("cta-row") && !row.children.length) row.remove();
      }
    })();
  </script>
